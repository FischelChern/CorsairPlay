# CorsairPlay API reverse proxy. Included globally; does not expose the local port.
<IfModule mod_proxy.c>
    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:8765/api/
    ProxyPassReverse /api/ http://127.0.0.1:8765/api/

    <Location /api/>
        Require all granted
    </Location>
</IfModule>
